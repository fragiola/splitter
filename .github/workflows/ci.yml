# CI: the Fragiola project jobs.
#
#   Checks   Biome and the source layout check, TypeScript, the unit tests and the build (with the
#            .d.ts check), on every pull request and every push to main.
#
# The jobs that need what later Issues add join as it lands: the Playwright suites (playground and
# each examples app), the site export, the package check, the changeset check and the www trigger.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
